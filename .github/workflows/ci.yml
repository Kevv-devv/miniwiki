name: MiniWiki build, tests, and vulnerability scanning
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 'stable'
          cache: false
      - name: Require committed dependency checksums
        run: test -s go.sum || (echo 'Commit a verified go.sum alongside go.mod before tagging beta' >&2; exit 1)
      - name: Fetch pinned modules
        run: go mod download
      - name: Verify module checksum integrity
        run: go mod verify
      - name: Ensure dependency files are tidy and committed
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Tests (including concurrency)
        run: go test -mod=readonly -race ./...
      - name: Go static checks
        run: go vet -mod=readonly ./...
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          govulncheck ./...
  cross-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: freebsd
            goarch: amd64
          - goos: freebsd
            goarch: arm64
          - goos: openbsd
            goarch: amd64
          - goos: openbsd
            goarch: arm64
          - goos: netbsd
            goarch: amd64
          - goos: netbsd
            goarch: arm64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 'stable'
          cache: false
      - name: Require committed dependency checksums
        run: test -s go.sum || (echo 'Commit a verified go.sum alongside go.mod before tagging beta' >&2; exit 1)
      - run: go mod download
      - name: Verify dependency checksums
        run: go mod verify
      - name: Build MiniWiki executable
        run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build -mod=readonly -o miniwiki-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }} ./cmd/wiki
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: miniwiki-${{ matrix.goos }}-${{ matrix.goarch }}
          path: miniwiki-${{ matrix.goos }}-${{ matrix.goarch }}*
