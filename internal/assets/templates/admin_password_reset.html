{{define "content"}}
<div class="page-header"><div><h1>Confirm administrator password reset</h1><p class="muted">This action immediately replaces the account password. It is recorded in the audit log.</p></div></div>
<div class="card">
  <p>Account: <strong>{{.TargetUser.Username}}</strong> (ID {{.TargetUser.ID}})</p>
  <form method="post" action="/user/{{.TargetUser.ID}}/password" class="edit-form narrow">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <input type="hidden" name="confirm" value="1">
    <label>New password (8–72 UTF-8 bytes) <input name="password" type="password" required minlength="8" autocomplete="new-password"></label>
    <p><button type="submit" class="button primary">Confirm password reset</button> <a class="button" href="/users">Cancel</a></p>
  </form>
</div>
{{end}}{{template "base" .}}
